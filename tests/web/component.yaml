apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web-tests
  description: The auth app's tests (the OAuth providers, the generated secret, the health route and the sign-in redirects, over real SQLite with the migrations applied), run on every pull request
spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  domain: tests
  subscribe:
    environments:
      - name: dev
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: platform
    layer: test
