apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The auth app (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment; better-auth through better-auth-cloudflare, its users in D1, its sessions in KV, its uploads in R2)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # The OAuth providers' client ids and secrets, stored per environment as the
  # product's secrets (README → Sign-in providers). BEST-EFFORT,
  # wire-now-seed-later: a key nobody has stored is skipped when the job
  # resolves its secrets (no env var, no failure), and the sign-in page
  # without them offers anonymous and email sign-in and says how to add a
  # provider. A BETTER_AUTH_SECRET, if stored, replaces the one the migrations
  # generate in D1.
  optionalSecretEnv:
    GITHUB_CLIENT_ID: "secret://better-auth-starter/better-auth-starter/{{ .environment }}/GITHUB_CLIENT_ID"
    GITHUB_CLIENT_SECRET: "secret://better-auth-starter/better-auth-starter/{{ .environment }}/GITHUB_CLIENT_SECRET"
    GOOGLE_CLIENT_ID: "secret://better-auth-starter/better-auth-starter/{{ .environment }}/GOOGLE_CLIENT_ID"
    GOOGLE_CLIENT_SECRET: "secret://better-auth-starter/better-auth-starter/{{ .environment }}/GOOGLE_CLIENT_SECRET"
    BETTER_AUTH_SECRET: "secret://better-auth-starter/better-auth-starter/{{ .environment }}/BETTER_AUTH_SECRET"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: better-auth-starter-web-{dev,stage,prod}.
    workerName: better-auth-starter-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # Render this environment's wrangler config, then build. Until the D1, KV
    # and R2 roots land (BA2) every environment renders from the committed
    # fixture. The OAuth secrets never reach the build (`env -u`): the Worker
    # reads them at request time, so neither a bundle nor the bundler's cache
    # holds them. Then each one the environment has goes to the Worker as a
    # SECRET (tooling/wire/worker-secrets.mjs: `wrangler secret bulk`, the
    # values over stdin) before the composition deploys it. Only the deploy
    # lane holds a Cloudflare credential, so a verify lane builds the same and
    # pushes nothing.
    buildCommand: node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components cloudflare-d1,cloudflare-kv,cloudflare-r2 --env "${ORUN_ENVIRONMENT}" --fixture wiring.fixture.json --fixture-envs dev,stage,prod && env -u GITHUB_CLIENT_ID -u GITHUB_CLIENT_SECRET -u GOOGLE_CLIENT_ID -u GOOGLE_CLIENT_SECRET -u BETTER_AUTH_SECRET pnpm exec turbo run build --filter=@app/web && node ../../tooling/wire/worker-secrets.mjs --secret GITHUB_CLIENT_ID --secret GITHUB_CLIENT_SECRET --secret GOOGLE_CLIENT_ID --secret GOOGLE_CLIENT_SECRET --secret BETTER_AUTH_SECRET --worker "better-auth-starter-web-${ORUN_ENVIRONMENT}" --config wrangler.jsonc

    # Smoke: the sign-in page renders to its end (`</html>` — a render that
    # throws partway through a streamed page still sent a 200), and
    # /api/health answers ok — which only the Worker can, by reading its D1
    # (the generated auth secret, so the migrations applied), KV and R2
    # bindings. Read-only. Each response is buffered before grep so an early
    # match cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q '</html>' && health=$(curl -sf \"${DEPLOYED_URL}/api/health\") && echo \"${health}\" | grep -q '\"ok\":true'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
